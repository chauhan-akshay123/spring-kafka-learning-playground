server:
  port: 8081

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:9000/learnKafka?options=-c%20TimeZone=UTC
    username: testUser
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.akshay.learnKafka.notification_service.event
        spring.json.value.default.type: com.akshay.learnKafka.notification_service.event.UserCreatedEvent
        spring.json.use.type.headers: false